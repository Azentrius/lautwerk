# The one version of the repository (Semantic Versioning). Both apps take their
# versionName from it and derive versionCode (see build.gradle.kts); the CI and
# the release workflow check it against CHANGELOG.md and the existing tags.
version=0.1.18
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
