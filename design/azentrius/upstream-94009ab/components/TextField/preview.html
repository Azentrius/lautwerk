<!-- @dsCard group="Eingabe" height=200 -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Eingabefeld — Vorschau</title></head>
<body>
<div class="az-demo az-demo--col" style="max-width:520px">
  <div class="az-field">
    <label class="az-field__label" for="f-sched">Zeitplan<span class="az-required" aria-hidden="true">*</span></label>
    <input class="az-input az-mono" id="f-sched" value="0 3 * * 1" autocomplete="off" spellcheck="false">
    <p class="az-field__help">Montags um 03:00</p>
  </div>
  <div class="az-field">
    <label class="az-field__label" for="f-cmd">Befehl<span class="az-required" aria-hidden="true">*</span></label>
    <input class="az-input az-mono" id="f-cmd" value="" placeholder="/opt/scripts/backup.sh" aria-invalid="true" aria-describedby="f-cmd-err">
    <p class="az-field__error" id="f-cmd-err"><svg class="az-icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M504 256c0 136.997-111.043 248-248 248S8 392.997 8 256C8 119.083 119.043 8 256 8s248 111.083 248 248zm-248 50c-25.405 0-46 20.595-46 46s20.595 46 46 46 46-20.595 46-46-20.595-46-46-46zm-43.673-165.346l7.418 136c.347 6.364 5.609 11.346 11.982 11.346h48.546c6.373 0 11.635-4.982 11.982-11.346l7.418-136c.375-6.874-5.098-12.654-11.982-12.654h-63.383c-6.884 0-12.356 5.78-11.981 12.654z"/></svg>Geben Sie einen Befehl ein.</p>
  </div>
</div>
</body>
</html>
