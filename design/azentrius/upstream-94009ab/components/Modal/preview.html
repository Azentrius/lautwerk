<!-- @dsCard group="Rückmeldung" height=380 -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Dialog — Vorschau</title><style>html,body{height:100%} .az-backdrop--inline{min-height:380px;box-sizing:border-box}</style></head>
<body>
<div class="az-backdrop az-backdrop--inline">
  <div class="az-modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="az-modal__header">
      <h2 class="az-modal__title" id="m-title">Job bearbeiten</h2>
      <button class="az-btn az-btn--plain az-btn--sm" type="button" aria-label="Schließen"><svg class="az-icon" viewBox="0 0 352 512" aria-hidden="true"><path d="M242.72 256l100.07-100.07c12.28-12.28 12.28-32.19 0-44.48l-22.24-22.24c-12.28-12.28-32.19-12.28-44.48 0L176 189.28 75.93 89.21c-12.28-12.28-32.19-12.28-44.48 0L9.21 111.45c-12.28 12.28-12.28 32.19 0 44.48L109.28 256 9.21 356.07c-12.28 12.28-12.28 32.19 0 44.48l22.24 22.24c12.28 12.28 32.2 12.28 44.48 0L176 322.72l100.07 100.07c12.28 12.28 32.2 12.28 44.48 0l22.24-22.24c12.28-12.28 12.28-32.19 0-44.48L242.72 256z"/></svg></button>
    </div>
    <div class="az-modal__body">
      <div class="az-field">
        <label class="az-field__label" for="m-sched">Zeitplan</label>
        <input class="az-input az-mono" id="m-sched" value="30 1 * * 0">
        <p class="az-field__help">Sonntags um 01:30</p>
      </div>
      <div class="az-field">
        <label class="az-field__label" for="m-cmd">Befehl</label>
        <input class="az-input az-mono" id="m-cmd" value="/usr/sbin/fstrim -a">
      </div>
    </div>
    <div class="az-modal__footer">
      <button class="az-btn az-btn--primary" type="button">Speichern</button>
      <button class="az-btn az-btn--link" type="button">Abbrechen</button>
    </div>
  </div>
</div>
</body>
</html>
