<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Schalter — Vorschau</title></head>
<body>
<div class="az-demo">
  <label class="az-switch"><input type="checkbox" id="sw-on" checked><span class="az-switch__track"></span><span class="az-switch__label">Aktiv</span></label>
  <label class="az-switch"><input type="checkbox" id="sw-off"><span class="az-switch__track"></span><span class="az-switch__label">Deaktiviert</span></label>
  <label class="az-switch"><input type="checkbox" id="sw-dis" checked disabled><span class="az-switch__track"></span><span class="az-switch__label">Paketverwaltet</span></label>
</div>
</body>
</html>
