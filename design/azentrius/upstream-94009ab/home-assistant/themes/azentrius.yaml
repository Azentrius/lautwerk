# Azentrius für Home Assistant, erzeugt aus tokens.json des Azentrius Design System.
# Nicht von Hand ändern: python3 scripts/home-assistant-theme.py
# Hell folgt „Azentrius hell“, Dunkel „Azentrius dunkel“; Home Assistant wählt nach seiner Einstellung.
# Geprüft gegen Home Assistant 2026.10 (Frontend 20260930.4).
# SPDX-License-Identifier: Apache-2.0
Azentrius:
  # Schrift: DM Sans für die Oberfläche, Red Hat Mono für Code
  ha-font-family-body: '"DM Sans", system-ui, sans-serif'
  ha-font-family-heading: '"DM Sans", system-ui, sans-serif'
  ha-font-family-longform: '"DM Sans", system-ui, sans-serif'
  ha-font-family-code: '"Red Hat Mono", RedHatMono, "Courier New", monospace'
  ha-font-weight-bold: "600"
  # Form: Karten flach mit Rahmen, Dialoge mit großem Radius
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-card-box-shadow: "none"
  ha-dialog-border-radius: "24px"
  modes:
    light:
      # Flächen: bg-page als Grund, bg-card für Karten, bg-floating für Schwebendes
      primary-background-color: "#f2f1ee"
      secondary-background-color: "#ebe9e4"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      ha-dialog-surface-background: "#ffffff"
      ha-color-surface-default: "#ffffff"
      ha-color-surface-low: "#f2f1ee"
      ha-color-surface-lower: "#e7e4dd"
      ha-color-on-surface-default: "#0a0a0f"
      mdc-dialog-scrim-color: "#15151566"
      # Kopf und Seitenleiste liegen auf dem Seitengrund, wie der Seitenkopf der Addons
      app-header-background-color: "#f2f1ee"
      app-header-text-color: "#0a0a0f"
      app-theme-color: "#f2f1ee"
      sidebar-background-color: "#f2f1ee"
      sidebar-text-color: "#0a0a0f"
      sidebar-icon-color: "#57544d"
      sidebar-selected-icon-color: "#0a0a0f"
      sidebar-selected-text-color: "#0a0a0f"
      # Text
      primary-text-color: "#0a0a0f"
      secondary-text-color: "#57544d"
      disabled-text-color: "#a8a49b"
      text-primary-color: "#ffffff"
      ha-color-text-primary: "#0a0a0f"
      ha-color-text-secondary: "#57544d"
      ha-color-text-disabled: "#a8a49b"
      ha-color-text-link: "#7d5f22"
      # Linien und Fokus
      divider-color: "#e2dfd8"
      outline-color: "#e2dfd8"
      outline-hover-color: "#8a867c"
      ha-card-border-color: "#e2dfd8"
      ha-color-border-neutral-quiet: "#e2dfd8"
      ha-color-border-neutral-normal: "#8a867c"
      ha-color-border-neutral-loud: "#57544d"
      ha-color-focus: "#7d5f22"
      # Aktionsfarbe: im Hellen Tinte, im Dunkeln Gold
      primary-color: "#0a0a0f"
      dark-primary-color: "#2b2b33"
      darker-primary-color: "#2b2b33"
      light-primary-color: "#e7e4dd"
      text-light-primary-color: "#0a0a0f"
      ha-color-primary-30: "#2b2b33"
      ha-color-primary-40: "#0a0a0f"
      ha-color-primary-50: "#0a0a0f"
      ha-color-fill-primary-loud-resting: "#0a0a0f"
      ha-color-fill-primary-loud-hover: "#2b2b33"
      ha-color-fill-primary-loud-active: "#0a0a0f"
      ha-color-on-primary-loud: "#ffffff"
      ha-color-fill-primary-normal-resting: "#e7e4dd"
      ha-color-fill-primary-normal-hover: "#e2dfd8"
      ha-color-fill-primary-normal-active: "#e7e4dd"
      ha-color-fill-primary-quiet-resting: "#ebe9e4"
      ha-color-fill-primary-quiet-hover: "#e7e4dd"
      ha-color-fill-primary-quiet-active: "#ebe9e4"
      ha-color-on-primary-normal: "#0a0a0f"
      ha-color-on-primary-quiet: "#0a0a0f"
      ha-color-border-primary-loud: "#0a0a0f"
      ha-color-border-primary-normal: "#0a0a0f"
      ha-color-border-primary-quiet: "#e2dfd8"
      # Schalter: an in primary mit on-primary-Knopf, aus in bg-control mit line-control-Rahmen
      ha-switch-background-color: "#ffffff"
      ha-switch-background-color-hover: "#ebe9e4"
      ha-switch-border-color: "#8a867c"
      ha-switch-thumb-background-color: "#8a867c"
      ha-switch-thumb-border-color: "#8a867c"
      ha-switch-checked-background-color: "#0a0a0f"
      ha-switch-checked-background-color-hover: "#2b2b33"
      ha-switch-checked-border-color: "#0a0a0f"
      ha-switch-checked-border-color-hover: "#2b2b33"
      ha-switch-checked-thumb-background-color: "#ffffff"
      ha-switch-checked-thumb-border-color: "#ffffff"
      # Neutrale Flächen und deaktivierte Elemente
      ha-color-fill-neutral-quiet-resting: "#ebe9e4"
      ha-color-fill-neutral-quiet-hover: "#e7e4dd"
      ha-color-fill-neutral-quiet-active: "#ebe9e4"
      ha-color-fill-neutral-normal-resting: "#e7e4dd"
      ha-color-fill-neutral-normal-hover: "#e2dfd8"
      ha-color-fill-neutral-normal-active: "#e7e4dd"
      ha-color-fill-neutral-loud-resting: "#57544d"
      ha-color-fill-neutral-loud-hover: "#0a0a0f"
      ha-color-fill-neutral-loud-active: "#57544d"
      ha-color-on-neutral-loud: "#ffffff"
      ha-color-on-neutral-normal: "#0a0a0f"
      ha-color-on-neutral-quiet: "#57544d"
      ha-color-fill-disabled-quiet-resting: "#ebe9e4"
      ha-color-fill-disabled-quiet-hover: "#e7e4dd"
      ha-color-fill-disabled-normal-resting: "#ebe9e4"
      ha-color-fill-disabled-normal-hover: "#e7e4dd"
      ha-color-fill-disabled-loud-resting: "#e7e4dd"
      ha-color-fill-disabled-loud-hover: "#e2dfd8"
      ha-color-on-disabled-quiet: "#a8a49b"
      ha-color-on-disabled-normal: "#a8a49b"
      ha-color-on-disabled-loud: "#a8a49b"
      # Eingabefelder: im Hellen bg-hover, im Dunkeln bg-page, damit sie sich von Dialog und Karte abheben
      ha-color-form-background: "#ebe9e4"
      ha-color-form-background-hover: "#e7e4dd"
      ha-color-form-background-disabled: "#f2f1ee"
      input-fill-color: "#ebe9e4"
      input-ink-color: "#0a0a0f"
      input-label-ink-color: "#57544d"
      input-idle-line-color: "#57544d"
      input-outlined-idle-border-color: "#8a867c"
      # Status wie in der Statussprache; Hinweise und Zähler der Seitenleiste als Hinweis, nie in Gold
      success-color: "#3d7317"
      warning-color: "#b07e00"
      error-color: "#b1380b"
      info-color: "#5e40be"
      accent-color: "#5e40be"
      text-accent-color: "#ffffff"
      # Schatten nur für Schwebendes
      ha-box-shadow-s: "0 1px 6px 0 #29292926"
      ha-box-shadow-m: "0 4px 10px 0 #29292926"
      ha-box-shadow-l: "0 10px 20px 0 #29292926"
      # Symbole der Entitäten ohne eigene Zustandsfarbe; Gerätefarben wie Bernstein für Licht bleiben die von Home Assistant
      state-icon-color: "#57544d"
      # Statusfarben für Buttons, Hinweise und Labels: getönt mit on-tint-Schrift, kräftig mit on-Schrift
      ha-color-fill-danger-loud-resting: "#b1380b"
      ha-color-fill-danger-normal-resting: "#fbc5c5"
      ha-color-fill-danger-quiet-resting: "#fbc5c5"
      ha-color-fill-danger-loud-hover: "#b1380b"
      ha-color-fill-danger-normal-hover: "#fbc5c5"
      ha-color-fill-danger-quiet-hover: "#fbc5c5"
      ha-color-fill-danger-loud-active: "#b1380b"
      ha-color-fill-danger-normal-active: "#fbc5c5"
      ha-color-fill-danger-quiet-active: "#fbc5c5"
      ha-color-on-danger-loud: "#ffffff"
      ha-color-on-danger-normal: "#151515"
      ha-color-on-danger-quiet: "#151515"
      ha-color-border-danger-loud: "#b1380b"
      ha-color-border-danger-normal: "#b1380b"
      ha-color-border-danger-quiet: "#fbc5c5"
      ha-color-fill-warning-loud-resting: "#b07e00"
      ha-color-fill-warning-normal-resting: "#ffe072"
      ha-color-fill-warning-quiet-resting: "#ffe072"
      ha-color-fill-warning-loud-hover: "#b07e00"
      ha-color-fill-warning-normal-hover: "#ffe072"
      ha-color-fill-warning-quiet-hover: "#ffe072"
      ha-color-fill-warning-loud-active: "#b07e00"
      ha-color-fill-warning-normal-active: "#ffe072"
      ha-color-fill-warning-quiet-active: "#ffe072"
      ha-color-on-warning-loud: "#151515"
      ha-color-on-warning-normal: "#151515"
      ha-color-on-warning-quiet: "#151515"
      ha-color-border-warning-loud: "#b07e00"
      ha-color-border-warning-normal: "#b07e00"
      ha-color-border-warning-quiet: "#ffe072"
      ha-color-fill-success-loud-resting: "#3d7317"
      ha-color-fill-success-normal-resting: "#d1f1bb"
      ha-color-fill-success-quiet-resting: "#d1f1bb"
      ha-color-fill-success-loud-hover: "#3d7317"
      ha-color-fill-success-normal-hover: "#d1f1bb"
      ha-color-fill-success-quiet-hover: "#d1f1bb"
      ha-color-fill-success-loud-active: "#3d7317"
      ha-color-fill-success-normal-active: "#d1f1bb"
      ha-color-fill-success-quiet-active: "#d1f1bb"
      ha-color-on-success-loud: "#ffffff"
      ha-color-on-success-normal: "#151515"
      ha-color-on-success-quiet: "#151515"
      ha-color-border-success-loud: "#3d7317"
      ha-color-border-success-normal: "#3d7317"
      ha-color-border-success-quiet: "#d1f1bb"
