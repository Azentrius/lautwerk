# Dependabot version updates: one grouped pull request per week for
# minor and patch updates; major updates arrive as separate pull requests.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
