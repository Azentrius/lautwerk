name: Android build and JVM tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version and changelog
        run: sh tools/check-version.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install the pinned Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: JVM tests, Android lint of every module, all debug builds
        run: >-
          bash ./gradlew --no-daemon
          :core:test :providers:test :voice:test
          :app:lintDebug :prototype-app:lintPhoneDebug :prototype-app:lintDhuDebug
          :car-ui:lintDebug :settings:lintDebug :storage:lintDebug :speech-output:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest
          :prototype-app:assemblePhoneDebug :prototype-app:assembleDhuDebug
          :prototype-app:assembleDhuDebugAndroidTest
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          retention-days: 14
          path: |
            core/build/reports/tests/
            providers/build/reports/tests/
            voice/build/reports/tests/
            */build/reports/lint-results-*.*
# Device/DHU/audio checks run separately on the phone; no secrets or live API calls in CI.
