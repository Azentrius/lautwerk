# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, runs the same tests, lint and builds as CI, packs the source and
# creates the tag vVERSION with a GitHub release (source tarball, SHA256SUMS, notes from
# CHANGELOG.md) and a signed build provenance for the tarball. No APKs: the apps are
# built from source (see the README); they are not for distribution.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.16 (empty: the version in gradle.properties)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write       # tag and release
  id-token: write       # signing the build provenance
  attestations: write   # storing the build provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sh tools/check-version.sh)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from gradle.properties ($code). Change gradle.properties first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install the pinned Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: JVM tests, Android lint of every module, all debug builds
        run: >-
          bash ./gradlew --no-daemon
          :core:test :providers:test :voice:test
          :app:lintDebug :prototype-app:lintPhoneDebug :prototype-app:lintDhuDebug
          :car-ui:lintDebug :settings:lintDebug :storage:lintDebug :speech-output:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest
          :prototype-app:assemblePhoneDebug :prototype-app:assembleDhuDebug
          :prototype-app:assembleDhuDebugAndroidTest

      - name: Package the source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=lautwerk-$VERSION
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > SHA256SUMS

      - name: Build provenance for the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: lautwerk-${{ steps.version.outputs.version }}.tar.gz

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" > notes.md
          name=lautwerk-$VERSION
          {
            echo
            echo "### Source"
            echo
            echo '```sh'
            echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$name.tar.gz"
            echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/SHA256SUMS"
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify $name.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "A prototype for testing on your own devices: not for use while driving and not for app stores."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Lautwerk $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" "lautwerk-$VERSION.tar.gz" SHA256SUMS "$@"
